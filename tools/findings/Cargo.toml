# Standalone probes, one for each library finding of the divergence sweep. They
# call the libraries directly and use no Replicant code. See README.md.
[package]
name = "findings"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Not a member of the Replicant workspace.
[workspace]

[dependencies]
# Exact versions: a finding is a claim about one version of a library.
automerge  = "=0.12.0"
yrs        = "=0.28.1"
anyhow     = "1"
flate2     = "1.1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true
