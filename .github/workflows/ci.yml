name: CI

# CI does not run when every changed file matches paths-ignore. A push that
# also changes code still runs. The list names what to skip, not what to run,
# so a new source directory triggers CI by default.
#
# Skipped: markdown, the archived data in data/ (only notebooks read it), and
# repo dotfiles. Not skipped: analysis/ (`just test-py` tests its helpers),
# scenarios/ (`just check-scenarios` reads it), the Justfile, scripts/, the
# Dockerfile, deploy/, proto/, pyproject.toml, uv.lock, rust-toolchain.toml,
# and this file.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'data/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'data/**'
      - '.gitignore'
      - '.gitattributes'

env:
  CARGO_TERM_COLOR: always

# A newer run on the same ref cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The local gate, `just ci`. Running the recipe, not a copy of its steps,
  # keeps CI and the local gate the same. rustup reads the toolchain from
  # rust-toolchain.toml, so this file pins no Rust version.
  gate:
    name: just ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # `just test-py` needs the locked Python packages. `just setup` installs
      # them into .venv, and the Justfile prefers that python3 when it exists.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python packages
        run: just setup
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Run the gate
        run: just ci

  # The real workloads, which the local gate leaves out, because their traces are
  # not in the repository. A library or driver change can break B3 or B4 and still
  # pass the tests. The replay checks the final content, so a wrong result fails
  # this job. The times on a shared runner have no use.
  replay-suite:
    name: just replay-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Download the archived traces
        run: just fetch-traces
      - name: Run every workload once on every library
        run: just replay-check

  # The deployment check that the local gate leaves out, because it needs a
  # docker daemon. For each CRDT library, it builds the replica image, starts
  # a compose stack with observability, runs one trial, and tears down. The
  # first run builds the image cold. The later runs reuse its layers, so they
  # are fast.
  smoke-docker:
    name: just smoke-docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # gen-compose.py needs pyyaml. `just setup` installs the locked packages
      # into .venv, and the Justfile prefers that python3 when it exists.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python packages
        run: just setup
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      # The text scenario covers more than the sync path: it also runs the
      # EnsureText bootstrap and the text-length check through the real stack.
      # The library list comes from the Justfile, so CI cannot drift from it.
      - name: Run docker smoke for each CRDT library
        run: |
          for crdt in $(just --evaluate crdts); do
            just smoke-docker scenarios/full-mesh-n2-text.toml "$crdt"
          done
      # One containerized replica runs the workload for one replica, and reports
      # the workload for two replicas as skipped. The replay checks the content.
      - name: Run a replay on one containerized replica for each CRDT library
        run: |
          for crdt in $(just --evaluate crdts); do
            just replay-docker 1 "$crdt" --spec workloads/smoke.toml \
              --data-dir workloads/fixtures --trials 1
          done
