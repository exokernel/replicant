# yaml-language-server: $schema=
# (Disables IDE schema auto-match: SchemaStore picks the SDK-side
# "OpenTelemetry Declarative Configuration" schema by filename, but this is
# a Collector pipeline config — different spec, no file_format field.)
#
# OTel collector pipeline: OTLP gRPC in (from replicas), Prometheus scrape out.
#
# Single source of truth used by both docker compose (bind-mount from
# ../shared/) and k8s (Kustomize configMapGenerator in deploy/k8s/base/
# kustomization.yaml).
#
# The Prometheus exporter exposes /metrics on :8889; the prometheus service
# scrapes that endpoint. Replicas send OTLP via
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # `actor` and `peer` arrive as resource attributes from the replica's SDK;
    # promote them to labels so PromQL queries like
    # `max(replicant_doc_size_bytes) by (actor)` work as expected.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
