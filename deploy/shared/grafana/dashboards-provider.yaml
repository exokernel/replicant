# Grafana dashboard provider. Tells Grafana to load JSON dashboards from
# /var/lib/grafana/dashboards/ at startup. `allowUiUpdates: true` means
# in-UI edits are persisted to Grafana's database and survive Grafana
# restarts (until the next provisioning reload of the source JSON).
#
# `updateIntervalSeconds: 0` disables periodic re-reading of the source
# JSON so saved UI edits aren't clobbered by the provisioned baseline
# during a session. Bumping the source JSON still applies on Grafana
# restart.
apiVersion: 1

providers:
  - name: replicant-dashboards
    orgId: 1
    folder: Replicant
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 0
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
