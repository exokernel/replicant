# Five replicas + otel-collector + prometheus on a shared bridge network for
# single-host benchmark runs.
#
# Network: each replica listens on 50051 inside its container; peers dial
# each other via service DNS (replica-N:50051). External: published as host
# ports 50051..50055 so the orchestrator on the host can reach each replica
# via localhost:5005N. Prometheus UI on :9090.
#
# Run via `just smoke-docker` (see Justfile), or manually from the repo root:
#   docker compose -f deploy/docker/compose.yaml up -d --build
#   cargo run --release --bin orchestrator -- \
#     --replicas localhost:50051=replica-0:50051,localhost:50052=replica-1:50051,localhost:50053=replica-2:50051,localhost:50054=replica-3:50051,localhost:50055=replica-4:50051 \
#     scenarios/full-mesh-n5.toml
#   docker compose -f deploy/docker/compose.yaml down

name: replicant

x-replica: &replica
  build:
    context: ../..        # workspace root, so the Dockerfile and .dockerignore there apply
    dockerfile: Dockerfile
  networks: [replicant]
  restart: "no"
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  depends_on:
    otel-collector:
      condition: service_started

services:
  replica-0:
    <<: *replica
    container_name: replica-0
    hostname: replica-0
    command: ["--actor", "node-0", "--port", "50051"]
    ports: ["50051:50051"]

  replica-1:
    <<: *replica
    container_name: replica-1
    hostname: replica-1
    command: ["--actor", "node-1", "--port", "50051"]
    ports: ["50052:50051"]

  replica-2:
    <<: *replica
    container_name: replica-2
    hostname: replica-2
    command: ["--actor", "node-2", "--port", "50051"]
    ports: ["50053:50051"]

  replica-3:
    <<: *replica
    container_name: replica-3
    hostname: replica-3
    command: ["--actor", "node-3", "--port", "50051"]
    ports: ["50054:50051"]

  replica-4:
    <<: *replica
    container_name: replica-4
    hostname: replica-4
    command: ["--actor", "node-4", "--port", "50051"]
    ports: ["50055:50051"]

  # Receives OTLP gRPC from replicas on :4317; exposes a Prometheus scrape
  # endpoint on :8889. Pinned tag so `docker compose up` is reproducible.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0
    container_name: otel-collector
    hostname: otel-collector
    networks: [replicant]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC (also reachable from host orchestrator)
      - "8889:8889"  # Prometheus scrape endpoint

  # Scrapes the collector; UI on :9090 for ad-hoc PromQL during a run.
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    hostname: prometheus
    networks: [replicant]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      otel-collector:
        condition: service_started

networks:
  replicant:
    driver: bridge
