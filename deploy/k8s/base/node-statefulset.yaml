# Five replica pods named node-0..node-4 (StatefulSet ordinals → stable
# DNS), each running the replica binary with --actor matching its pod name.
#
# The actor name MUST equal the pod name because the orchestrator wires
# scenarios by index expecting actor IDs node-0..node-{n-1}. We get this
# for free by naming the StatefulSet `node`.
#
# `$(POD_NAME)` and `$(CRDT)` are k8s's own env-var substitution (not
# shell), so a distroless image with no /bin/sh still works.
#
# CRDT selects the backing library and defaults to automerge. It is an env
# var rather than a literal arg so a caller can retarget the whole
# StatefulSet with `kubectl set env statefulset/node CRDT=loro` without
# patching or regenerating this manifest — see the `crdt` parameter on the
# smoke-k8s / bench-k8s / k8s-up recipes. Keep the value in sync with the
# `Crdt` enum in crates/replica/src/adapter.rs; an unknown value is
# rejected by the binary at startup, so a typo shows up as a pod that will
# not start rather than as wrong measurements.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node
  labels:
    app.kubernetes.io/name: node
    app.kubernetes.io/part-of: replicant
spec:
  serviceName: node
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node
        app.kubernetes.io/part-of: replicant
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: replica
          image: replicant-replica:dev
          args:
            - "--actor"
            - "$(POD_NAME)"
            - "--port"
            - "50051"
            - "--crdt"
            - "$(CRDT)"
          env:
            - name: CRDT
              value: automerge
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            # OTel SDK default flush is 60s — too coarse for the dashboard's
            # rate panels to show anything other than one big counter jump
            # per scenario. 2s matches Prometheus's scrape interval, so any
            # multi-second workload produces a visible curve.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "2000"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
