# Tool versions for this repository. Rust is pinned in rust-toolchain.toml.
#
# Entering the repository activates .venv, and creates it if it is missing.
# Then run `just setup` to install the Python packages into it.

[tools]
python = "3.14"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the locked Python packages into .venv"
run = "uv sync --quiet"

[tasks."setup:archive"]
description = "Also install the packages for the archived Jupyter notebooks"
run = "uv sync --quiet --group archive"

[tasks."tour:edit"]
description = "Open the guided marimo notebook in a browser, with its code"
run = "python -m marimo edit analysis/tour.py"

[tasks."tour:run"]
description = "Open the guided marimo notebook as an app, with the code hidden"
run = "python -m marimo run analysis/tour.py"
